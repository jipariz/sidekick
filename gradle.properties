#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#KMP
kotlin.mpp.enableCInteropCommonization=true

#Publishing
# Each publishable module owns its sdk.version in <module>/version.properties.
# The property below is ONLY the BOM's own version. Calendar-versioned —
# bump to today's YYYY.MM.DD when cutting a BOM release.
sidekick.bomVersion=2026.07.21