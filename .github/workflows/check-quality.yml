name: Static analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run detekt
        run: ./gradlew detekt

  explicit-api:
    # `explicitApi()` is a compiler setting, so the gate is simply that the
    # library modules still compile. Metadata alone covers commonMain, which is
    # where nearly all of the public surface lives, and keeps CI off the
    # native/web toolchains.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Compile under explicit API mode
        # Unqualified task names run in every project that has them, so there is no
        # hand-maintained module list to drift. Metadata covers commonMain;
        # compileAndroidMain is included because androidMain sources are NOT part of
        # the metadata compilation and would otherwise go unchecked.
        run: ./gradlew compileKotlinMetadata compileAndroidMain
