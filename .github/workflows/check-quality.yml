name: Static analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The default stores GITHUB_TOKEN in .git/config, where PR-controlled
          # Gradle code could read it. Nothing here needs to push.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run detekt
        run: ./gradlew detekt

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      # jvmTest rather than allTests: the suite is pure common code, so one target
      # proves it, and this keeps CI off the native/web toolchains.
      - name: Run unit tests
        run: ./gradlew jvmTest

  docs:
    # The docs site is only built by the manually-dispatched deploy workflow, so
    # broken links and dead anchors survived until someone happened to deploy.
    # --strict promotes mkdocs' link warnings to failures, which is the whole
    # point: a warning nobody reads is not a gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Build docs strictly
        run: mkdocs build --strict

  api-compatibility:
    # Fails when the published API surface drifts from the committed signature
    # files. A breaking change then shows up as a reviewable diff in api/*.api
    # instead of as a consumer's NoSuchMethodError. Regenerate deliberately with
    # `./gradlew metalavaGenerateSignature` when the change is intended.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Check API compatibility
        run: ./gradlew metalavaCheckCompatibility

      # metalavaCheckCompatibility only rejects *breaking* changes, so a purely
      # additive change leaves the committed signature stale and still passes —
      # which defeats the point of reviewing API changes as a diff. Regenerating
      # and requiring a clean tree makes additions show up too.
      - name: Check API signatures are up to date
        run: |
          ./gradlew metalavaGenerateSignature
          if ! git diff --quiet -- '*/api/*.api'; then
            echo "::error::API signatures are stale. Run ./gradlew metalavaGenerateSignature and commit."
            git --no-pager diff -- '*/api/*.api'
            exit 1
          fi

  explicit-api:
    # `explicitApi()` is a compiler setting, so the gate is simply that the
    # library modules still compile. Metadata alone covers commonMain, which is
    # where nearly all of the public surface lives, and keeps CI off the
    # native/web toolchains.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The default stores GITHUB_TOKEN in .git/config, where PR-controlled
          # Gradle code could read it. Nothing here needs to push.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Compile under explicit API mode
        # Unqualified task names run in every project that has them, so there is no
        # hand-maintained module list to drift.
        #
        # Every target is listed because explicit-API violations are per-source-set:
        # metadata covers commonMain only, and a public declaration added to
        # androidMain/jsMain/wasmJsMain with inferred visibility would otherwise pass.
        # Missing androidMain here is exactly how the original sweep shipped
        # incomplete. iOS cannot build on Linux and is covered by the macOS job below.
        run: >
          ./gradlew compileKotlinMetadata compileAndroidMain
          compileKotlinJvm compileKotlinJs compileKotlinWasmJs

  explicit-api-apple:
    # iOS needs a macOS runner, and it is worth the minutes: the crash monitor's
    # Kotlin/Native behaviour differs enough from the JVM that a target-specific
    # regression is realistic.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Compile Apple targets under explicit API mode
        run: ./gradlew compileKotlinIosSimulatorArm64
