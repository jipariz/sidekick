name: Deploy Docs & Demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

# Opt JavaScript actions (actions/checkout, setup-java, setup-python,
# upload-artifact, …) into Node 24 ahead of GitHub's June 2nd, 2026 forced
# migration. Silences the "Node.js 20 actions are deprecated" workflow
# warning emitted on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-demo:
    name: Build web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # composeCompatibilityBrowserDistribution emits a single dist containing
      # both wasm and JS bundles + a tiny `webApp.js` loader shim that probes
      # wasm-GC support and falls back to the JS variant on older browsers.
      - name: Build web demo (wasm + JS compatibility dist)
        run: ./gradlew :demo:webApp:composeCompatibilityBrowserDistribution --no-daemon

      - name: Inject coi-serviceworker for SharedArrayBuffer support
        working-directory: demo/webApp/build/dist/composeWebCompatibility/productionExecutable
        run: |
          # GitHub Pages cannot set COOP/COEP headers, so we use
          # coi-serviceworker to enable SharedArrayBuffer client-side
          # (required by SQLite WASM / Room).
          curl -sL https://unpkg.com/coi-serviceworker@0.1.7/coi-serviceworker.min.js -o coi-serviceworker.min.js
          sed -i 's|</head>|<script src="coi-serviceworker.min.js"></script></head>|' index.html

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-dist
          path: demo/webApp/build/dist/composeWebCompatibility/productionExecutable/
          retention-days: 1

  build-docs:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build docs
        run: mkdocs build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-demo, build-docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Download demo dist
        uses: actions/download-artifact@v4
        with:
          name: demo-dist
          path: site/demo/

      - name: Add .nojekyll
        run: touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
