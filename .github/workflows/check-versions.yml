name: Check module versions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The default stores GITHUB_TOKEN in .git/config, where PR-controlled
          # Gradle code could read it. Nothing here needs to push.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify each module's version matches its source-content hash
        run: ./gradlew checkModuleVersions --no-configuration-cache
