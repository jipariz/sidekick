[versions]
agp = "9.2.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.18.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0-beta01"
androidx-testExt = "1.3.0"
composeHotReload = "1.1.1"
composeMultiplatform = "1.11.0"
composeMaterial3 = "1.11.0-alpha07"
junit = "4.13.2"
kotlin = "2.3.21"
kotlinx-coroutines = "1.11.0"
ksp = "2.3.8"
androidx-datastore = "1.3.0-alpha09"
kotlinpoet = "2.3.0"
ktor = "3.5.0"
kotlinxSerialization = "1.11.0"
coil = "3.5.0-beta01"
koin = "4.2.1"
kermit = "2.1.0"
compose-adaptive = "1.3.0-beta01"
material3AdaptiveNavigationSuite = "1.9.0"
navigation3 = "1.1.2"
navigationeventCompose = "1.1.0"
# AOSP versions used as forced upgrades against the 2.2-era klibs that the
# adaptive-navigation3 1.3.0-beta01 graph pulls in transitively. Picking the
# lowest abi=2.3.0 release for each artifact.
androidxLifecycleAosp = "2.11.0-beta02"
androidxSavedstateAosp = "1.5.0"
androidxNavigationeventAosp = "1.1.1"
room3 = "3.0.0-alpha05"
sqlite = "2.7.0-alpha05"
reveal = "4.2.0"
vanniktechMavenPublish = "0.36.0"
androidxPaging = "3.5.0"
navigation3Browser = "1.0.0"
reorderable = "3.1.0"
ktfmt = "0.26.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
ksp-api                  = { module = "com.google.devtools.ksp:symbol-processing-api",       version.ref = "ksp" }
kotlinpoet-core          = { module = "com.squareup:kotlinpoet",                             version.ref = "kotlinpoet" }
kotlinpoet-ksp           = { module = "com.squareup:kotlinpoet-ksp",                         version.ref = "kotlinpoet" }
androidx-datastore-prefs = { module = "androidx.datastore:datastore-preferences",            version.ref = "androidx-datastore" }
kotlinx-coroutinesCore   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",       version.ref = "kotlinx-coroutines" }
ktor-client-core              = { module = "io.ktor:ktor-client-core",                   version.ref = "ktor" }
ktor-client-okhttp            = { module = "io.ktor:ktor-client-okhttp",                 version.ref = "ktor" }
ktor-client-cio               = { module = "io.ktor:ktor-client-cio",                    version.ref = "ktor" }
ktor-client-js                = { module = "io.ktor:ktor-client-js",                     version.ref = "ktor" }
ktor-client-darwin            = { module = "io.ktor:ktor-client-darwin",                 version.ref = "ktor" }
kotlinx-serialization-json        = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",      version.ref = "kotlinxSerialization" }
ktor-client-contentNegotiation    = { module = "io.ktor:ktor-client-content-negotiation",                version.ref = "ktor" }
ktor-serialization-kotlinxJson    = { module = "io.ktor:ktor-serialization-kotlinx-json",                version.ref = "ktor" }
coil-compose                      = { module = "io.coil-kt.coil3:coil-compose",                          version.ref = "coil" }
coil-network-ktor                 = { module = "io.coil-kt.coil3:coil-network-ktor3",                    version.ref = "coil" }
koin-core                             = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android                          = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose                          = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel                = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
room3-runtime                     = { module = "androidx.room3:room3-runtime",                            version.ref = "room3" }
room3-compiler                    = { module = "androidx.room3:room3-compiler",                           version.ref = "room3" }
sqlite-bundled                    = { module = "androidx.sqlite:sqlite-bundled",                          version.ref = "sqlite" }
sqlite-web                        = { module = "androidx.sqlite:sqlite-web",                              version.ref = "sqlite" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
# Compose Multiplatform per-artifact entries. CMP 1.11.0 deprecated the
# `compose.runtime` / `compose.foundation` / `compose.material3` / `compose.ui`
# / `compose.preview` / `compose.materialIconsExtended` String accessors with
# the message "Specify dependency directly." — these catalog entries are the
# replacement.
#
# Most artifacts track `composeMultiplatform` exactly, but two are out-of-band:
#  - material3 lags behind (CMP 1.11.0 pairs with material3 1.11.0-alpha07);
#    bump composeMaterial3 manually with the plugin to keep this aligned.
#  - material-icons-extended is pinned at 1.7.3 — JetBrains is freezing this
#    artifact and steering users toward Material Symbols.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-material-iconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-adaptive" }
compose-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "compose-adaptive" }
compose-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "compose-adaptive" }
# Nav3 list-detail scene strategy — pairs the AndroidX Navigation 3 backstack
# with the Material 3 adaptive list/detail/extra pane layout. Atomic group with
# the other `adaptive-*` artifacts so it follows `compose-adaptive`.
compose-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "compose-adaptive" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
# Force-bump from the 1.0.1 that `adaptive-navigation3` 1.3.0-beta01 transitively
# pulls — that build is Kotlin 2.2.20 (abi 2.2.0), and its Wasm klib still
# references `kotlin.wasm.internal.externrefToBoolean`, which Kotlin 2.3 no
# longer exports. 1.1.0 is the 2.3.20 rebuild (abi 2.3.0).
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationeventCompose" }
# AOSP-side forced upgrades — see comments on `androidxLifecycleAosp` etc.
# These artifacts at their old versions (lifecycle 2.10.0, savedstate 1.4.0,
# navigationevent 1.0.2 / 1.1.0) were built with Kotlin 2.2 and emit Wasm
# imports for `kotlin.wasm.internal.externrefToBoolean`, which 2.3 no longer
# exports — instantiation fails at runtime with "function import requires a
# callable". The versions below are the 2.3.20-built (abi 2.3.0) replacements.
androidx-lifecycle-runtime-aosp = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidxLifecycleAosp" }
androidx-lifecycle-common-aosp = { module = "androidx.lifecycle:lifecycle-common", version.ref = "androidxLifecycleAosp" }
androidx-lifecycle-runtimeCompose-aosp = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycleAosp" }
androidx-savedstate-aosp = { module = "androidx.savedstate:savedstate", version.ref = "androidxSavedstateAosp" }
androidx-savedstate-compose-aosp = { module = "androidx.savedstate:savedstate-compose", version.ref = "androidxSavedstateAosp" }
androidx-navigationevent-aosp = { module = "androidx.navigationevent:navigationevent", version.ref = "androidxNavigationeventAosp" }
androidx-navigationevent-compose-aosp = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "androidxNavigationeventAosp" }
compose-material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3AdaptiveNavigationSuite" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
reveal-core = { module = "com.svenjacobs.reveal:reveal-core", version.ref = "reveal" }
reveal-shapes = { module = "com.svenjacobs.reveal:reveal-shapes", version.ref = "reveal" }
androidx-paging-common  = { module = "androidx.paging:paging-common",  version.ref = "androidxPaging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "androidxPaging" }
# terrakok's tiny lib that wires androidx.navigation3 to the browser History API
# (back/forward → backstack). Web targets only (js/wasmJs).
navigation3-browser = { module = "com.github.terrakok:navigation3-browser", version.ref = "navigation3Browser" }
# Calvin Liang's drag-to-reorder lib for Compose Multiplatform — used by
# core/shell to let developers rearrange the plugin menu tiles. Publishes
# android, iosArm64, iosSimulatorArm64, jvm, js, wasmJs variants.
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }


[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp       = { id = "com.google.devtools.ksp",  version.ref = "ksp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room3               = { id = "androidx.room3",                              version.ref = "room3" }
vanniktechMavenPublish = { id = "com.vanniktech.maven.publish",             version.ref = "vanniktechMavenPublish" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }